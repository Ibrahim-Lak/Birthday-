
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Fatima ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffe0e6, #f5b5ca, #d9a5c5);
}

#background {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.bubble, .heart {
  position: absolute;
  bottom: -80px;
  animation: rise linear infinite;
}

.bubble {
  border-radius: 50%;
  background: rgba(255,255,255,.3);
  border: 1px solid rgba(255,255,255,.6);
}

.heart {
  font-size: 25px;
}

@keyframes rise {
  0% {
    transform: translateY(0) rotate(0);
    opacity: 0;
  }
  20% { opacity: .8; }
  100% {
    transform: translateY(-120vh) rotate(360deg);
    opacity: 0;
  }
}

.card {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 30px;
  animation: appear 2s ease;
}

.cake {
  font-size: 75px;
  margin-bottom: 25px;
}

h1 {
  font-size: clamp(38px, 10vw, 65px);
  color: #bd5277;
  font-weight: normal;
  margin-bottom: 20px;
}

.name {
  font-size: clamp(45px, 12vw, 75px);
  color: #a33e69;
  font-style: italic;
  text-shadow: 2px 4px 15px #ffffff80;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.7);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>

<div id="background"></div>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Happy Birthday</h1>
  <div class="name">Fatima ❤️</div>
</div>

<script>
const bg = document.getElementById("background");

function createBubble() {
  const b = document.createElement("div");
  b.className = "bubble";

  let size = Math.random() * 45 + 15;
  b.style.width = size + "px";
  b.style.height = size + "px";
  b.style.left = Math.random() * 100 + "vw";
  b.style.animationDuration = (5 + Math.random() * 7) + "s";

  bg.appendChild(b);
  setTimeout(() => b.remove(), 13000);
}

function createHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = ["❤️","💕","💗","💖"][Math.floor(Math.random()*4)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (6 + Math.random() * 6) + "s";

  bg.appendChild(h);
  setTimeout(() => h.remove(), 13000);
}

setInterval(createBubble, 400);
setInterval(createHeart, 600);
</script>

</body>
</html>
