
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>this is for u 🎂</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg, #ff0080, #7928ca, #00c6ff);
  background-size: 600% 600%;
  animation: bgMove 10s ease infinite;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.content {
  position: relative;
  z-index: 5;
  padding: 20px;
}

h1 {
  font-size: clamp(30px, 7vw, 50px);
  animation: bounce 1.5s infinite;
  text-shadow: 0 0 20px #ffffff80;
}

p {
  font-size: 20px;
  margin-top: 20px;
}

@keyframes bounce {
  0%, 100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

/* الفقاعات */
.bubble {
  position: fixed;
  bottom: -100px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow: inset 0 0 15px rgba(255,255,255,0.2);
  animation: floatUp linear infinite;
  pointer-events: none;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.8);
    opacity: 0;
  }
  20% {opacity: 0.8;}
  100% {
    transform: translateY(-120vh) scale(1.3);
    opacity: 0;
  }
}

/* القلوب */
.heart {
  position: fixed;
  bottom: -60px;
  font-size: 25px;
  animation: heartUp linear infinite;
  pointer-events: none;
}

@keyframes heartUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  20% {opacity: 1;}
  100% {
    transform: translateY(-120vh) rotate(360deg);
    opacity: 0;
  }
}

/* Confetti */
.confetti {
  position: fixed;
  width: 9px;
  height: 9px;
  top: -15px;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="content">
  <h1>🎉 Happy Birthday 🎉</h1>
  <p>Fatima ❤️</p>
  <p>Best wishes for you 💖</p>
</div>

<script>

// إنشاء الفقاعات
function createBubble() {
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const size = Math.random() * 50 + 15;

  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.left = Math.random() * 100 + "vw";
  bubble.style.animationDuration = (6 + Math.random() * 7) + "s";

  document.body.appendChild(bubble);

  setTimeout(() => bubble.remove(), 14000);
}

// إنشاء القلوب
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";

  const hearts = ["❤️", "💕", "💗", "💖", "💘", "💜"];

  heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (5 + Math.random() * 7) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 13000);
}

// إنشاء Confetti
function createConfetti() {
  const confetti = document.createElement("div");
  confetti.className = "confetti";

  confetti.style.left = Math.random() * 100 + "vw";
  confetti.style.backgroundColor =
    "hsl(" + Math.random() * 360 + ", 100%, 70%)";

  confetti.style.animationDuration = (3 + Math.random() * 3) + "s";

  document.body.appendChild(confetti);

  setTimeout(() => confetti.remove(), 6000);
}

// تشغيل المؤثرات باستمرار
setInterval(createBubble, 350);
setInterval(createHeart, 500);
setInterval(createConfetti, 150);

</script>

</body>
</html>
